    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2; this.speedX = (Math.random() - 0.5) * 0.25;
                this.speedY = (Math.random() - 0.5) * 0.25; this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 12000);
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

                    listToRender.forEach(member => {
                        const card = document.createElement('div');
                        card.className = `member-card`;
                        const avatarUrl = (member.avatar && member.avatar.trim() !== "") ? member.avatar : globalDefaultAvatar;
                        card.innerHTML = `
                            <img src="${avatarUrl}" class="member-avatar" alt="${member.name}">
                            <div class="member-info">
                                <h3 class="member-name" title="${member.name}">${member.name}</h3>
                                <span class="role-tag">${member.role}</span>
                            </div>
                            <a href="${member.facebookUrl || '#'}" target="_blank" class="fb-btn" title="Facebook Profile">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            </a>
                        `;
                        grid.appendChild(card);
                    });
                    section.classList.add('has-data');
                }
            });
        }

        initCategoryContainers();

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true'); 
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const config = docSnap.data();
                if (config.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${config.bgUrl}')`;
                if (config.faviconUrl) document.getElementById('siteFavicon').href = config.faviconUrl;
                if (config.memberTitle) document.getElementById('dynMemberTitle').innerText = config.memberTitle;
                if (config.memberSubTitle) document.getElementById('dynMemberSubTitle').innerText = config.memberSubTitle;
                if (config.defaultAvatar) globalDefaultAvatar = config.defaultAvatar;
                if (config.musicTitle) document.getElementById('musicTitle').innerText = config.musicTitle;
                if (config.musicLinkText) document.getElementById('musicLink').innerText = config.musicLinkText;
                if (config.musicLinkUrl) document.getElementById('musicLink').href = config.musicLinkUrl;
                if (config.musicCoverUrl) document.getElementById('musicCover').src = config.musicCoverUrl;
            }
        });

        onSnapshot(collection(db, "members"), (snapshot) => {
            let firebaseMembers = [];
            snapshot.forEach(doc => { firebaseMembers.push({ id: doc.id, ...doc.data() }); });
            membersData = firebaseMembers;
            renderMembers(membersData, searchInput.value);
        });

        searchInput.addEventListener('input', (e) => { 
            currentMemberPage = 1; 
            renderMembers(membersData, e.target.value); 
        });
        document.getElementById('searchBtn').addEventListener('click', () => { 
            currentMemberPage = 1; 
            renderMembers(membersData, searchInput.value); 
        });
    </script>
</body>
</html>
