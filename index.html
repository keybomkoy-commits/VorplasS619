<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vorplas S619</title>
    <link rel="icon" id="siteFavicon" href="">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes pageFadeIn {
            0% { opacity: 0; filter: blur(10px); transform: scale(1.03); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            font-family: 'Inter', sans-serif; background-color: #000000; color: #d0d5dc;
            overflow: hidden; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            animation: pageFadeIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 0; will-change: transform;
            animation: bgZoom 60s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
        }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

        /* ปรับความทึบลดลง เพื่อให้เห็นพื้นหลังชัดขึ้น */
        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.85) 0%, rgba(2, 6, 15, 0.75) 100%);
            z-index: 1; pointer-events: none;
        }

        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        .main-content {
            position: relative; z-index: 3; flex: 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; gap: clamp(15px, 2.5vh, 25px); width: 100%;
            overflow-y: auto;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); filter: drop-shadow(0 0 15px rgba(50, 100, 160, 0.15)); }
            50% { transform: translateY(-8px); filter: drop-shadow(0 0 35px rgba(50, 100, 160, 0.35)); }
        }

        .emblem-container {
            position: relative; width: clamp(200px, 28vw, 300px); height: clamp(200px, 28vw, 300px);
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 0px; flex-shrink: 0;
            animation: logoFloat 6s ease-in-out infinite;
            will-change: transform;
        }

        .main-logo {
            width: 100%; height: 100%; object-fit: contain; z-index: 2; pointer-events: none;
        }

        .header-section { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0; width: 100%; padding: 5px 0; }

        @keyframes shineText { 
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        @keyframes titleFloatGlow {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 8px rgba(50, 100, 160, 0.1)); }
            50% { transform: translateY(-3px); filter: drop-shadow(0 0 20px rgba(50, 100, 160, 0.4)); }
        }

        .main-title {
            font-family: 'Cinzel', serif; 
            font-size: clamp(2.2rem, 5vw, 4rem); 
            letter-spacing: 0.15em; margin: 0; font-weight: 800; text-transform: uppercase; 
            background: linear-gradient(to right, #ffffff 20%, #88aadd 50%, #ffffff 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shineText 8s linear infinite, titleFloatGlow 6s ease-in-out infinite;
            will-change: transform, filter;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding: 10px;
        }

        .dark-divider {
            display: flex; align-items: center; justify-content: center; gap: 14px; 
            color: #88aadd;
            font-family: 'Cinzel', serif; 
            font-size: clamp(0.7rem, 1.2vw, 0.85rem); 
            letter-spacing: 0.4em; text-transform: uppercase; font-weight: 700; 
            width: 100%; text-shadow: 0 0 10px rgba(80, 130, 200, 0.5);
        }
        
        .dark-divider::before, .dark-divider::after {
            content: ''; width: clamp(40px, 12vw, 120px); height: 2px;
            background: linear-gradient(90deg, transparent, rgba(136, 170, 221, 0.7), transparent);
            box-shadow: 0 0 8px rgba(80, 130, 200, 0.6);
            border-radius: 50%;
        }

        @keyframes pulseSpark {
            0%, 100% { transform: scale(1); opacity: 0.5; text-shadow: 0 0 5px #5a8ac0; }
            50% { transform: scale(1.3); opacity: 1; text-shadow: 0 0 12px #88aadd, 0 0 20px #ffffff; }
        }
        .divider-spark {
            font-size: 0.6rem;
            color: #5a8ac0;
            animation: pulseSpark 4s ease-in-out infinite;
            user-select: none;
        }

        .btn-container {
            display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 400px; z-index: 10; margin-top: 10px;
        }

        .btn-members {
            position: relative;
            width: 100%;
            padding: clamp(16px, 2.2vh, 20px) 0;
            border-radius: 6px;
            background: rgba(3, 3, 5, 0.8);
            border: 1px solid rgba(50, 90, 140, 0.3);
            color: #ffffff;
            font-family: 'Cinzel', serif; 
            font-weight: 700;
            font-size: clamp(1.05rem, 1.8vw, 1.3rem); 
            letter-spacing: 0.35em;
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(50,100,160,0.05);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            z-index: 1;
        }

        .btn-members::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(50,100,160,0.15) 0%, transparent 70%);
            opacity: 0; transition: opacity 0.6s ease; z-index: -1;
        }

        @keyframes softShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        .btn-members::after {
            content: ''; position: absolute; inset: -1px; border-radius: 6px;
            background: linear-gradient(90deg, transparent, rgba(70, 130, 200, 0.3), transparent);
            background-size: 200% 100%; animation: softShimmer 6s linear infinite;
            z-index: -2; opacity: 0.2; transition: opacity 0.6s ease;
        }

        .btn-members:hover {
            transform: translateY(-3px);
            border-color: rgba(70, 130, 200, 0.6);
            background: rgba(8, 12, 18, 0.9);
            box-shadow: 0 12px 30px rgba(0,0,0,0.9), 0 0 20px rgba(70, 130, 200, 0.25), inset 0 0 15px rgba(70, 130, 200, 0.1);
            letter-spacing: 0.38em; 
            text-shadow: 0 0 15px rgba(255,255,255,0.7);
        }

        .btn-members:hover::before { opacity: 1; }
        .btn-members:hover::after { opacity: 0.6; animation-duration: 3s; }

        .partner-section-wrapper { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 700px; z-index: 10; margin-top: 10px; }
        .partner-heading { font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(0.75rem, 1.2vw, 0.9rem); letter-spacing: 0.3em; color: #5a7a9a; text-transform: uppercase; text-shadow: 0 0 8px rgba(50,100,160,0.2); opacity: 0.7; }
        .partner-buttons-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }

        .partner-btn {
            position: relative;
            text-decoration: none; 
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(50, 90, 140, 0.2); 
            border-radius: 4px;
            padding: clamp(10px, 1.4vh, 14px) clamp(22px, 3vw, 34px);
            color: #8a9ab0; 
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: clamp(0.78rem, 1.1vw, 0.9rem);
            text-transform: uppercase; letter-spacing: 0.2em;
            backdrop-filter: blur(10px); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            overflow: hidden;
            z-index: 1;
        }

        .partner-btn::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(50,100,160,0.1) 0%, transparent 80%);
            opacity: 0; transition: opacity 0.5s ease; z-index: -1;
        }

        .partner-btn:hover {
            transform: translateY(-2px); 
            color: #ffffff;
            border-color: rgba(70, 130, 200, 0.5);
            box-shadow: 0 8px 25px rgba(0,0,0,0.7), 0 0 15px rgba(50, 100, 160, 0.15);
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
            background: rgba(5, 8, 12, 0.8);
        }
        .partner-btn:hover::before { opacity: 1; }

        .music-widget {
            position: fixed; bottom: 20px; right: 20px; background: rgba(2, 3, 5, 0.95);
            backdrop-filter: blur(15px); border: 1px solid rgba(50, 90, 140, 0.2); border-radius: 8px; 
            width: 280px; z-index: 99999; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }
        .music-widget.collapsed { height: 55px; }
        .music-widget.expanded { height: 110px; }
        .music-header { display: flex; align-items: center; padding: 8px 12px; height: 55px; box-sizing: border-box; cursor: pointer; }
        .cover-wrapper { position: relative; width: 34px; height: 34px; margin-right: 10px; flex-shrink: 0; }
        .music-cover {
            width: 100%; height: 100%; border-radius: 4px;
            object-fit: cover;
            border: 1px solid rgba(50, 90, 140, 0.3); animation: spinRecord 6s linear infinite; animation-play-state: paused;
        }
        .playing .music-cover { animation-play-state: running; border-color: #5a8ac0; box-shadow: 0 0 8px rgba(50,100,160,0.4); }
        @keyframes spinRecord { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label { font-size: 0.4rem; color: #5a8ac0; letter-spacing: 0.2em; font-weight: 700; }
        .music-title { font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
        .music-link { font-size: 0.42rem; color: #5a7a9a; text-decoration: none; }
        .toggle-icon { font-size: 0.48rem; color: #5a8ac0; padding: 4px; transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
        .music-controls { display: flex; align-items: center; padding: 0 14px 10px 14px; gap: 12px; opacity: 0; transition: opacity 0.4s ease; border-top: 1px solid rgba(50, 90, 140, 0.15); background: rgba(0,0,0,0.8); }
        .music-widget.expanded .music-controls { opacity: 1; transition-delay: 0.1s; }
        .ctrl-btn { background: rgba(50, 90, 140, 0.1); border: 1px solid rgba(50, 90, 140, 0.3); color: #ccc; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: 0.3s;}
        .ctrl-btn:hover { background: rgba(50, 90, 140, 0.25); color: #fff; box-shadow: 0 0 8px rgba(50, 100, 160, 0.2); }
        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(50, 90, 140, 0.08); padding: 2px 8px; border-radius: 4px; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 2px; background: rgba(50, 90, 140, 0.2); outline: none; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; background: #5a8ac0; cursor: pointer; border-radius: 2px; box-shadow: 0 0 4px rgba(50,100,160,0.5); transition: transform 0.2s;}
        .vol-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

        .footer-credit {
            position: relative; z-index: 3; width: 100%; text-align: center; padding: 12px 0;
            font-size: 0.55rem; color: #5a7a9a; letter-spacing: 0.35em; text-transform: uppercase; font-weight: 600;
            display: flex; justify-content: center; align-items: center; gap: 10px; flex-shrink: 0; opacity: 0.6;
        }
        .footer-link-web { color: #8a9ab0; text-decoration: none; transition: 0.3s; }
        .footer-link-web:hover { color: #ffffff; text-shadow: 0 0 10px rgba(70,130,200,0.6); }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <canvas id="particleCanvas"></canvas>

    <main class="main-content">
        <div class="emblem-container">
            <img id="mainLogo" src="" alt="Logo" class="main-logo" style="display: none;">
        </div>

        <header class="header-section">
            <h1 id="dynMainTitle" class="main-title">loading...</h1>
            <div class="dark-divider">
                <span class="divider-spark">✦</span>
                <span id="dynSubTitle">loading...</span>
                <span class="divider-spark">✦</span>
            </div>
        </header>
        
        <div class="btn-container">
            <a href="member.html" class="btn-members">
                <span>MEMBERS</span>
                <span>›</span>
            </a>
        </div>

        <div class="partner-section-wrapper" id="partnerSectionWrapper" style="display: none;">
            <div class="partner-heading">PARTNER</div>
            <div class="partner-buttons-group" id="partnerButtonsGroup"></div>
        </div>
    </main>

    <div id="musicWidget" class="music-widget collapsed">
        <div class="music-header" id="toggleMusicBtn">
            <div class="cover-wrapper">
                <img id="musicCover" class="music-cover" src="https://placehold.co/100x100/111/444?text=🎵" alt="Cover">
            </div>
            <div class="music-info-mini">
                <span class="music-label">AUDIO STREAM</span>
                <div id="musicTitle" class="music-title">Unknown Track</div>
                <a id="musicLink" class="music-link" href="#" target="_blank">SOURCE LINK</a>
            </div>
            <div id="toggleIcon" class="toggle-icon">▲</div>
        </div>
        <div class="music-controls">
            <button id="playPauseBtn" class="ctrl-btn">▶</button>
            <div class="vol-wrapper">
                <span class="vol-icon" style="font-size:0.4rem; color:#8a9ab0;">VOL</span>
                <input type="range" id="volumeSlider" class="vol-slider" min="0" max="1" step="0.01" value="0.2">
            </div>
        </div>
        <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <footer class="footer-credit">
        <span>SYSTEM DESIGN BY QA QEN</span>
        <span style="opacity: 0.3;">|</span>
        <a href="https://qaqenqcstudio.vercel.app" target="_blank" class="footer-link-web">คลิกเพื่อติดต่อทำเว็ป</a>
    </footer>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resizeCanvas); 
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2; 
                /* ปรับความเร็วเพิ่มขึ้น */
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4; 
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.shadowBlur = 6;
                ctx.shadowColor = `rgba(50, 100, 160, ${this.opacity})`;
                ctx.fillStyle = `rgba(200, 220, 240, ${this.opacity})`; 
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
                ctx.shadowBlur = 0; 
            }
        }
        const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 10000);
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCIUW4gcujOhWi9iDcP-1l66u4LsvrFD8",
            authDomain: "vorplass619.firebaseapp.com",
            projectId: "vorplass619",
            storageBucket: "vorplass619.firebasestorage.app",
            messagingSenderId: "1065299630556",
            appId: "1:1065299630556:web:da545ccd669c4d82955719"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true');
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const cfg = docSnap.data();
                if (cfg.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${cfg.bgUrl}')`;
                if (cfg.faviconUrl) document.getElementById('siteFavicon').href = cfg.faviconUrl;
                if (cfg.mainTitle) document.getElementById('dynMainTitle').innerText = cfg.mainTitle;
                if (cfg.subTitle) document.getElementById('dynSubTitle').innerText = cfg.subTitle;
                if (cfg.logoUrl) {
                    const logo = document.getElementById('mainLogo');
                    logo.src = cfg.logoUrl; logo.style.display = 'block';
                    if (cfg.logoWidth) logo.style.width = cfg.logoWidth;
                }
                if (cfg.musicTitle) document.getElementById('musicTitle').innerText = cfg.musicTitle;
                if (cfg.musicLinkText) document.getElementById('musicLink').innerText = cfg.musicLinkText;
                if (cfg.musicLinkUrl) document.getElementById('musicLink').href = cfg.musicLinkUrl;
                if (cfg.musicCoverUrl) document.getElementById('musicCover').src = cfg.musicCoverUrl;
            }
        });

        onSnapshot(collection(db, "partners"), (snapshot) => {
            const partnerGroup = document.getElementById('partnerButtonsGroup');
            const partnerWrapper = document.getElementById('partnerSectionWrapper');
            partnerGroup.innerHTML = '';
            
            if (snapshot.empty) {
                partnerWrapper.style.display = 'none';
                return;
            }

            partnerWrapper.style.display = 'flex';
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const a = document.createElement('a');
                a.href = p.url || '#';
                a.target = '_blank';
                a.className = 'partner-btn';
                a.innerText = p.name;
                partnerGroup.appendChild(a);
            });
        });
    </script>
</body>
</html>
